<!DOCTYPE html>
<html>
<head>
    <title>Alta Curso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/morph/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-5">
<div class="card shadow-sm p-4">
<h2 class="mb-4 fw-bold">New Workout</h2>

    <form action="register-workout" method="post" enctype="multipart/form-data">

<input name="name" class="form-control shadow-sm mb-3" placeholder="Name" required>
<input name="dificulty" class="form-control shadow-sm mb-3" placeholder="Dificulty" required>
<input name="duration" type="number" class="form-control shadow-sm mb-3" placeholder="Duration" required>
<input name="description" class="form-control shadow-sm mb-3" placeholder="Description" required>
        <select name="trainer_id" class="form-select shadow-sm mb-4">

            <option value="1">John Carter</option>
            <option value="2">Emily Davis</option>
            <option value="3">Michael Brown</option>

        </select>
<button class="btn btn-success shadow-sm">Save Workout</button>
    <a href="workouts" class="btn btn-secondary shadow-sm ms-2">Back</a>

</form>
</div>
</body>
</html>
