<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <title>Oh My GYM! - Fitness that hits different</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/vapor/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold"><img src="img/logo.png" alt="OMG Logo" height="50">OH MY GYM!</span>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-3">
                <li class="nav-item">
                    <a href="users" class="nav-link">Users</a>
                </li>
                <li class="nav-item">
                    <a href="trainers" class="nav-link">Trainers</a>
                </li>
                <li class="nav-item">
                    <a href="workouts" class="nav-link">Workouts</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="card shadow-sm p-4 text-center">
<h2 class="mb-4 fw-bold">New Workout</h2>

    <form action="register-workout" method="post" enctype="multipart/form-data">

<input name="name" class="form-control shadow-sm mb-3" placeholder="Name" required>
<input name="difficulty" class="form-control shadow-sm mb-3" placeholder="Difficulty" required>
<input name="duration" type="number" class="form-control shadow-sm mb-3" placeholder="Duration" required>
<input name="description" class="form-control shadow-sm mb-3" placeholder="Description" required>
        <select name="trainer_id" class="form-select shadow-sm mb-4">

            <option value="1">John Carter</option>
            <option value="2">Emily Davis</option>
            <option value="3">Michael Brown</option>

        </select>
<button class="btn btn-success shadow-sm">Save Workout</button>
    <a href="workouts" class="btn btn-secondary shadow-sm ms-2">Back</a>

</form>
</div>
</body>
</html>
