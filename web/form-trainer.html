<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <title>Oh My GYM! - Fitness that hits different</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/vapor/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold"><img src="img/logo.png" alt="OMG Logo" height="50">OH MY GYM!</span>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-3">
                <li class="nav-item">
                    <a href="users" class="nav-link">Users</a>
                </li>
                <li class="nav-item">
                    <a href="trainers" class="nav-link">Trainers</a>
                </li>
                <li class="nav-item">
                    <a href="workouts" class="nav-link">Workouts</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="card shadow-sm p-4 text-center">
    <h2 class="mb-4 fw-bold">New Trainer</h2>

<form action="register-trainer" method="post">

<input name="name" class="form-control shadow-sm mb-3" placeholder="Name" required>
<input name="speciality" class="form-control shadow-sm mb-3" placeholder="Speciality">
<input name="email" class="form-control shadow-sm mb-3" placeholder="Email" required>
<input name="experience_years" class="form-control shadow-sm mb-3" placeholder="Experience years">
<input name="phone" class="form-control shadow-sm mb-3" placeholder="Phone">

    <button class="btn btn-success shadow-sm">Save Trainer</button>
    <a href="trainers" class="btn btn-secondary shadow-sm ms-2">Back</a>

</form>

</body>
</html>
