<!DOCTYPE html>
<html>
<head>
    <title>Add Trainer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/vapor/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-5">
<div class="card shadow-sm p-4">
    <h2 class="mb-4 fw-bold">New Trainer</h2>

<form action="register-trainer" method="post">

<input name="name" class="form-control shadow-sm mb-3" placeholder="Name" required>
<input name="speciality" class="form-control shadow-sm mb-3" placeholder="Speciality">
<input name="email" class="form-control shadow-sm mb-3" placeholder="Email" required>
<input name="experience_years" class="form-control shadow-sm mb-3" placeholder="Experience years">
<input name="phone" class="form-control shadow-sm mb-3" placeholder="Phone">

    <button class="btn btn-success shadow-sm">Save Trainer</button>
    <a href="users" class="btn btn-secondary shadow-sm ms-2">Back</a>

</form>

</body>
</html>
